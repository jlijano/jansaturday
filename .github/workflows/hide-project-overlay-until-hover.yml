name: Hide project overlay until hover

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hover-only project metadata styles
        run: |
          if ! grep -q "PROJECT METADATA HOVER VISIBILITY" project-carousel.css; then
            cat >> project-carousel.css <<'EOF'

/* PROJECT METADATA HOVER VISIBILITY */
.portfolio-carousel__shade,
.portfolio-carousel__overlay {
  opacity: 0;
  visibility: hidden;
}

.portfolio-carousel__shade {
  transition: opacity .28s ease, visibility .28s ease;
}

.portfolio-carousel__overlay {
  transform: translateY(14px);
  transition: opacity .28s ease, visibility .28s ease, transform .28s ease;
}

.portfolio-carousel__slide.is-active:hover .portfolio-carousel__shade,
.portfolio-carousel__slide.is-active:focus-within .portfolio-carousel__shade,
.portfolio-carousel:focus-visible .portfolio-carousel__slide.is-active .portfolio-carousel__shade {
  opacity: 1;
  visibility: visible;
}

.portfolio-carousel__slide.is-active:hover .portfolio-carousel__overlay,
.portfolio-carousel__slide.is-active:focus-within .portfolio-carousel__overlay,
.portfolio-carousel:focus-visible .portfolio-carousel__slide.is-active .portfolio-carousel__overlay {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .portfolio-carousel__shade,
  .portfolio-carousel__overlay {
    transition: none;
  }
}
EOF
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-carousel.css
          git diff --cached --quiet && exit 0
          git commit -m "Show project metadata only on hover or focus"
          git push
