name: Remove hero secondary links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Download CV and LinkedIn from hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('            <a class="text-link" href="assets/documents/cv.html">Download CV <span aria-hidden="true">↗</span></a>\n', '', 1)
          linkedin = '''          <div class="social-links" aria-label="Social links">\n            <a class="linkedin-link" href="https://www.linkedin.com/in/jan-christian-l-585672aa/" target="_blank" rel="noopener noreferrer" aria-label="View Jan Lijano on LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V8.98h3.42v1.57h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.29ZM5.32 7.41a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.1 20.45H3.54V8.98H7.1v11.47Z"/></svg></a>\n          </div>\n'''
          if linkedin not in s:
              raise SystemExit('LinkedIn hero block not found')
          s = s.replace(linkedin, '', 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove hero CV and LinkedIn links"
          git push
