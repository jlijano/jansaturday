name: Apply white and cream theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply white and cream theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Update browser theme color.
          import re
          s = re.sub(r'<meta name="theme-color" content="#[0-9A-Fa-f]{6}">', '<meta name="theme-color" content="#FAF1EC">', s, count=1)

          marker = '<style id="white-cream-theme">'
          if marker not in s:
              css = r'''
  <style id="white-cream-theme">
    :root{
      --bg-primary:#FAF1EC;
      --bg-secondary:#F3E4DA;
      --section-bg:#FFFDFC;
      --card-bg:#FFFFFF;
      --card-elevated:#F7ECE4;
      --text-primary:#2F2420;
      --text-secondary:#6F5C54;
      --text-muted:#9B857A;
      --accent-purple:#D6B8A4;
      --accent-violet:#C9A58D;
      --accent-blue:#E4CEC2;
      --accent-cyan:#B58E76;
      --border-soft:rgba(91,66,54,.14);
      --border-hover:rgba(181,142,118,.55);
      --gradient:linear-gradient(135deg,#FFFDFC 0%,#F3E4DA 52%,#E4CEC2 100%);
      --shadow-card:0 18px 46px rgba(76,53,43,.10);
    }

    body{background:#FAF1EC;color:#2F2420}
    .site-header.scrolled{background:rgba(250,241,236,.94);border-color:rgba(91,66,54,.12);box-shadow:0 10px 30px rgba(76,53,43,.07)}
    .brand strong{color:#B58E76}
    .desktop-nav a{color:#6F5C54}
    .desktop-nav a:hover,.desktop-nav a.active{color:#2F2420}
    .desktop-nav a::after{background:linear-gradient(90deg,#C9A58D,#B58E76)}
    .menu-toggle{border-color:rgba(91,66,54,.16);background:rgba(255,255,255,.55)}
    .menu-toggle span{background:#2F2420}
    .mobile-menu{background:rgba(255,253,252,.98);border-color:rgba(91,66,54,.14);box-shadow:0 18px 48px rgba(76,53,43,.12)}
    .mobile-menu a{color:#6F5C54}

    .hero{background:radial-gradient(circle at 78% 20%,rgba(228,206,194,.62),transparent 30rem),radial-gradient(circle at 8% 52%,rgba(255,255,255,.95),transparent 26rem)}
    .eyebrow,.section-label,.mini-label,.contact-copy>a{color:#9A715B}
    .hero h1,.hero-role,h2,h3{color:#2F2420}
    .hero-role span{background:linear-gradient(135deg,#6E4E3E 0%,#B58E76 55%,#D6B8A4 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
    .hero-description,.about-copy p,.section-head>p,.blog-card p,.cta-card p,.contact-copy p{color:#6F5C54}
    .text-link{color:#6F5C54}
    .text-link:hover{color:#2F2420}

    .button{background:linear-gradient(135deg,#6E4E3E,#B58E76);color:#FFFDFC;box-shadow:0 12px 30px rgba(110,78,62,.18)}
    .button:hover{box-shadow:0 16px 34px rgba(110,78,62,.24)}
    .outline-button{border-color:rgba(110,78,62,.22);color:#6E4E3E;background:rgba(255,255,255,.55)}
    .outline-button:hover{border-color:#B58E76;color:#2F2420;background:#FFFDFC}

    .projects-carousel-section,.projects-section,.tools-section,.clients-section{background:#F3E4DA}
    .stat-card,.service-card,.project-card,.blog-card,.cta-card,.contact-form{background:#FFFDFC;border-color:rgba(91,66,54,.14);box-shadow:0 16px 38px rgba(76,53,43,.08)}
    .stat-card:hover,.service-card:hover,.project-card:hover{border-color:rgba(181,142,118,.55);box-shadow:0 22px 48px rgba(76,53,43,.12)}
    .stat-card strong,.stat-card p,.service-card h3,.service-card p,.project-body h3,.project-body p{color:#2F2420}
    .stat-card p,.service-card p,.project-body p{color:#6F5C54}
    .stat-card .icon,.service-icon,.project-arrow{color:#9A715B}
    .project-arrow{background:#F3E4DA}

    .project-carousel__item::before{background:linear-gradient(180deg,rgba(47,36,32,.04),rgba(47,36,32,.58))}
    .project-carousel__content,.project-carousel__title,.project-carousel__description,.project-carousel__eyebrow{color:#FFFDFC}
    .project-carousel__tags span{background:rgba(255,253,252,.88);color:#3E2F29;border-color:rgba(255,255,255,.35)}
    .project-carousel__control{background:#FFFDFC;color:#2F2420;border-color:rgba(91,66,54,.16)}

    .contact-form{background:#FFFFFF}
    .field label{color:#5E4B43}
    .field input,.field textarea{background:#FFFDFC;color:#2F2420;border-color:rgba(91,66,54,.18)}
    .field input:focus,.field textarea:focus{border-color:#B58E76;box-shadow:0 0 0 3px rgba(181,142,118,.16)}

    .site-footer{background:#F3E4DA;border-color:rgba(91,66,54,.12)}
    .footer-inner{color:#7A665D}
    .footer-inner a:hover{color:#2F2420}

    .social-links a,.social-links .linkedin-link{color:#6F5C54;border-color:rgba(91,66,54,.16);background:rgba(255,255,255,.55)}
    .social-links a:hover,.social-links .linkedin-link:hover,.social-links .linkedin-link:focus-visible{color:#2F2420;border-color:#B58E76;background:#FFFDFC;box-shadow:0 12px 28px rgba(76,53,43,.12)}

    :focus-visible{outline-color:#B58E76}
  </style>
'''
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply white and cream website theme"
          git push
