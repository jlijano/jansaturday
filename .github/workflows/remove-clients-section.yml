name: Remove clients section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove clients section and related assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace('        <a href="#clients">Clients</a>\n', '')
          s = s.replace('      <a href="#clients">Clients</a>\n', '')

          pattern = re.compile(r'\n    <section class="section clients-section" id="clients".*?</section>\n', re.S)
          s, count = pattern.subn('\n', s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one clients section, removed {count}')

          s = s.replace('  <script src="clients-carousel.js"></script>\n', '')
          p.write_text(s)
          PY

          rm -f clients-carousel.js clients-carousel.css

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove clients and organisations section"
          git push
