name: Fix intro video autoplay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable reliable muted autoplay and looping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project-carousel.js')
          s = p.read_text()
          old = 'const INTRO_VIDEO_URL = "https://player.cloudinary.com/embed/?cloud_name=brfm6p40&public_id=lv_0_20260912150315&autoplay=true&muted=false";'
          new = 'const INTRO_VIDEO_URL = "https://player.cloudinary.com/embed/?cloud_name=brfm6p40&public_id=lv_0_20260912150315&autoplay=true&muted=true&loop=true";'
          if old not in s:
              raise SystemExit('Expected intro video URL not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-carousel.js
          git commit -m "Enable reliable intro video autoplay"
          git push
