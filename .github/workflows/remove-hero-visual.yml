name: Remove hero visual

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove hero visual and rebalance layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = '<div class="hero-visual reveal"><div class="portrait-orbit" aria-hidden="true"></div><div class="shape cube-one" aria-hidden="true"></div><div class="shape cube-two" aria-hidden="true"></div><div class="shape sphere-one" aria-hidden="true"></div><div class="portrait-wrap"><img src="assets/headshot-portrait.svg" width="720" height="860" alt="Portrait of Jan Lijano" fetchpriority="high"></div><div class="experience-card"><strong>13+</strong><span>Years of<br>IT Experience</span></div></div>'
          if old not in s:
              raise SystemExit('Hero visual block not found')
          p.write_text(s.replace(old, '', 1))

          css = Path('style.css')
          c = css.read_text()
          marker = '/* HERO VISUAL REMOVAL OVERRIDES */'
          if marker not in c:
              c += '''\n\n/* HERO VISUAL REMOVAL OVERRIDES */\n.hero-grid{grid-template-columns:minmax(0,1fr);max-width:980px;margin-inline:auto}\n.hero-copy{max-width:900px}\n.hero-description{max-width:760px}\n@media (max-width:1024px){.hero-grid{grid-template-columns:1fr}}\n'''
              css.write_text(c)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git commit -m "Remove hero portrait visual and rebalance layout"
          git push
