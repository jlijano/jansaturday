name: Add maroon accents v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Append maroon accents
        run: echo ' ' | tr -d ' ' | base64 -d >> tools-clients.css
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools-clients.css
          git commit -m "Add maroon accents to white and cream UI"
          git push
