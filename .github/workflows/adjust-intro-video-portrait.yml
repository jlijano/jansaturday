name: Adjust intro video portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update intro video layout and playback request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project-carousel.js')
          s = p.read_text()

          replacements = [
              (
                  'const INTRO_VIDEO_URL = "https://player.cloudinary.com/embed/?cloud_name=brfm6p40&public_id=lv_0_20260912150315&autoplay=true&muted=true";',
                  'const INTRO_VIDEO_URL = "https://player.cloudinary.com/embed/?cloud_name=brfm6p40&public_id=lv_0_20260912150315&autoplay=true&muted=false";'
              ),
              (
                  'grid-template-columns:minmax(0,.92fr) minmax(440px,1.08fr) !important;',
                  'grid-template-columns:minmax(0,1fr) minmax(320px,.72fr) !important;'
              ),
              (
                  'max-width:620px;\n        justify-self:end;',
                  'max-width:360px;\n        justify-self:center;'
              ),
              (
                  'aspect-ratio:16/9;',
                  'aspect-ratio:9/16;'
              ),
              (
                  'left:18px;\n        bottom:18px;',
                  'left:14px;\n        top:14px;\n        bottom:auto;'
              ),
              (
                  'max-width:760px;\n          justify-self:stretch;',
                  'max-width:360px;\n          justify-self:center;'
              ),
              (
                  '.hero-intro-video__label{left:14px;bottom:14px;font-size:.68rem;}',
                  '.hero-intro-video{max-width:320px;}\n        .hero-intro-video__label{left:12px;top:12px;bottom:auto;font-size:.68rem;}'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected snippet not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-carousel.js
          git commit -m "Adjust intro video to portrait 9:16"
          git push
