name: Update hero title

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hero copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<h1 id="hero-title">Jan Lijano</h1><p class="hero-role">IT Project &amp; <span>Service Delivery Leader</span></p>'
          new = '<h1 id="hero-title">Jan Christian Lijano</h1><p class="hero-role"><span>AI Consultant</span></p>'
          if old not in s:
              raise SystemExit('Target hero markup not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update hero title to AI Consultant"
          git push
