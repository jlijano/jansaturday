name: Update hero description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hero description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'I lead technology projects, service operations, Microsoft 365 implementations, IT asset programmes, and digital transformation initiatives that improve efficiency, governance, and customer outcomes.'
          new = 'I help businesses adopt AI through practical automation, intelligent workflows, AI-powered tools, and digital solutions that improve efficiency, decision-making, and customer experiences.'
          if old not in s:
              raise SystemExit('Target hero description not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update hero description for AI consulting"
          git push
