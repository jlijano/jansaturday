name: Fix intro video visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make dynamic intro video visible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project-carousel.js')
          s = p.read_text()
          old = 'media.className = "hero-intro-video reveal";'
          new = 'media.className = "hero-intro-video reveal is-visible";'
          if old not in s:
              raise SystemExit('Expected intro video class assignment not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-carousel.js
          git commit -m "Fix intro video visibility"
          git push
