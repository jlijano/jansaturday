name: Remove experience section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove experience section and navigation links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Remove Experience links from desktop and mobile navigation.
          s = s.replace('        <a href="#experience">Experience</a>\n', '')
          s = s.replace('      <a href="#experience">Experience</a>\n', '')

          # Remove the full Professional Experience section.
          pattern = re.compile(r'\n    <section class="section experience-section" id="experience".*?</section>\n', re.S)
          s, count = pattern.subn('\n', s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one experience section, removed {count}')

          # Remove stylesheets used only by the removed experience section.
          s = s.replace('  <link rel="stylesheet" href="experience.css">\n', '')
          s = s.replace('  <link rel="stylesheet" href="experience-badge.css">\n', '')

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove professional experience section"
          git push
