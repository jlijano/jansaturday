name: Replace project carousel with video

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace carousel markup and add video styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html')
          s = html.read_text()

          pattern = re.compile(
              r'<div class="project-carousel reveal" data-project-carousel.*?<p class="project-carousel__status" data-project-carousel-status aria-live="polite"></p>\s*</div>',
              re.S,
          )

          replacement = '''<div class="portfolio-video reveal" aria-label="Featured AI video portfolio">
          <video class="portfolio-video__player" controls playsinline preload="metadata" aria-label="AI portfolio video">
            <source src="assets/videos/lv_0_20260912031425.mp4" type="video/mp4">
            Your browser does not support the video element.
          </video>
        </div>'''

          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one project carousel, replaced {count}')

          s = s.replace('Representative programmes and transformation work.', 'Featured AI and video portfolio.', 1)
          html.write_text(s)

          css = Path('project-carousel.css')
          c = css.read_text()
          marker = '/* PORTFOLIO VIDEO REPLACEMENT */'
          if marker not in c:
              c += '''\n\n/* PORTFOLIO VIDEO REPLACEMENT */\n.portfolio-video{\n  position:relative;\n  width:100%;\n  overflow:hidden;\n  border:1px solid rgba(78,9,17,.14);\n  border-radius:24px;\n  background:#260707;\n  box-shadow:0 22px 58px rgba(78,9,17,.14);\n}\n.portfolio-video__player{\n  display:block;\n  width:100%;\n  height:auto;\n  max-height:min(78vh,820px);\n  aspect-ratio:16/9;\n  object-fit:contain;\n  background:#260707;\n}\n.portfolio-video:focus-within{\n  outline:3px solid rgba(78,9,17,.28);\n  outline-offset:5px;\n}\n@media(max-width:820px){\n  .portfolio-video{border-radius:20px}\n}\n@media(max-width:560px){\n  .portfolio-video{border-radius:16px}\n  .portfolio-video__player{max-height:none}\n}\n'''
              css.write_text(c)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html project-carousel.css
          git commit -m "Replace project carousel with portfolio video player"
          git push
